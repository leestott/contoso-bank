name: Public source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check public content and history
        run: python check_publication.py
      - name: Run offline regression tests
        run: python -m unittest test_deploy_web test_voice_browser test_cloud test_settings test_banking tests
      - name: Check whitespace
        run: git diff --check

  dependencies:
    name: Known dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install audit tooling
        run: python -m pip install "pip-audit>=2.9,<3"
      - name: Audit web, test, voice and hosted-worker dependencies
        run: python -m pip_audit -r requirements-dev.txt -r requirements-voice.txt -r cloud/hosted/requirements.txt
